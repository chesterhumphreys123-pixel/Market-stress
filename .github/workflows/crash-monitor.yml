name: Market stress dashboard

on:
  schedule:
    - cron: "0 6 * * 1-5"    # 06:00 UTC weekdays, before the London open
    - cron: "30 21 * * 1-5"  # 21:30 UTC weekdays, after the US close
  workflow_dispatch:          # run it manually from the Actions tab

permissions:
  contents: write   # commit the CSV history back to the repo
  pages: write      # publish the dashboard
  id-token: write

concurrency:
  group: dashboard
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Run monitor and build page
        run: python crash_monitor.py
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      - name: Save history
        run: |
          git config user.name "stress-monitor"
          git config user.email "actions@github.com"
          git add crash_monitor_log.csv
          git commit -m "Reading $(date -u '+%F %H:%M')" || echo "No changes"
          git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
